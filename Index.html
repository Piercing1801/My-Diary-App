<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Приложение — регистрация и лидерборд</title>
<style>
  :root {
    --bg: #000;
    --acid1: #8cff3b;
    --acid2: #d4ff9f;
    --fire1: #ff5a00;
    --fire2: #ff9900;
    --muted: #9aa4b2;
    --card: #0b0b0b;
  }

  html,body {
    height:100%;
    margin:0;
    background:var(--bg);
    color:var(--acid2);
    font-family: Inter, "Trebuchet MS", Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  .screen { display:none; width:100vw; height:100vh; position:relative; overflow:hidden; }
  .screen.active { display:block; }

  #screenRegister { display:flex; align-items:flex-start; justify-content:center; }

  #regStage {
    position:relative;
    left:50%;
    transform:translateX(-50%) scale(1);
    transform-origin:50% 0;
    width:min(1200px,96vw);
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    gap:5vh;
    padding-top:0;
    box-sizing:border-box;
  }

  #welcomeBlock { width:min(1000px,90%); display:flex; align-items:center; justify-content:center; padding:0 12px; }
  #welcomeText {
    margin:0;
    font-weight:900;
    line-height:1;
    letter-spacing:-0.02em;
    font-size:clamp(36px, 8vw, 160px);
    background: linear-gradient(180deg, var(--acid1) 0%, #001100 80%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:3px 3px 6px rgba(140,255,59,0.9);
    text-align:center;
    width:100%;
  }

  #btnStart {
    width:clamp(260px,40vw,490px);
    height:clamp(48px,7vh,172px);
    border:5px solid #006600;
    border-radius:30px;
    color:var(--acid1);
    font-size:clamp(16px,3.5vw,48px);
    font-weight:800;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:transform .12s ease, background .12s ease;
    background:transparent;
  }
  #btnStart:active { transform:scale(.98); }

  #langWrap { position:fixed; top:12px; right:12px; display:flex; gap:10px; z-index:9999; }

  .fire-btn {
    border:none;
    border-radius:12px;
    padding:8px 12px;
    font-weight:900;
    cursor:pointer;
    color:#fff;
    background:linear-gradient(180deg, var(--fire1) 0%, var(--fire2) 45%, #660000 100%);
    box-shadow:0 0 10px rgba(255,120,0,0.6), inset 0 -6px 14px rgba(0,0,0,0.35);
    text-shadow:0 2px 6px rgba(0,0,0,0.6);
    outline:none;
    border:3px solid rgba(255,160,30,0.85);
    animation:ember 2.2s infinite linear;
  }
  @keyframes ember {
    0%   { filter:brightness(1) drop-shadow(0 0 6px rgba(255,120,0,0.6)); transform:translateY(0) scale(1); }
    50%  { filter:brightness(1.08) drop-shadow(0 0 14px rgba(255,200,60,0.9)); transform:translateY(-3px) scale(1.02); }
    100% { filter:brightness(1) drop-shadow(0 0 6px rgba(255,120,0,0.6)); transform:translateY(0) scale(1); }
  }
  .fire-btn:active { transform:scale(.98); animation:none; filter:brightness(.95); }

  #zoomControls {
    position:fixed;
    right:18px;
    bottom:18px;
    display:flex;
    flex-direction:column;
    gap:8px;
    z-index:9999;
  }
  #zoomControls button {
    width:48px;
    height:48px;
    border-radius:8px;
    border:none;
    background:rgba(255,255,255,0.06);
    color:#fff;
    font-size:20px;
    cursor:pointer;
  }

  #regFormOverlay {
    display:none;
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(1000px,92vw);
    height:min(860px,92vh);
    background:rgba(0,0,0,0.95);
    border:2px solid var(--acid1);
    border-radius:18px;
    z-index:2000;
    padding:20px;
    box-sizing:border-box;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3vh;
  }
  .reg-input {
    width:min(800px,86%);
    height:calc(172/2532*100vh);
    max-height:88px;
    border:3px solid var(--acid1);
    border-radius:12px;
    background:transparent;
    color:var(--acid1);
    font-size:clamp(14px,2.8vw,34px);
    padding:10px 16px;
    outline:none;
  }
  .reg-input::placeholder { color:rgba(140,255,59,0.45); }

  :focus { outline:3px solid rgba(140,255,59,0.12); outline-offset:2px; }

  #screenApp { padding:18px; box-sizing:border-box; }
  .topbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; }
  .btn { background:linear-gradient(90deg,var(--acid1),var(--acid2)); border:none; color:#001; padding:8px 12px; border-radius:8px; cursor:pointer; font-weight:800; }
  .btn.secondary { background:transparent; color:var(--acid2); border:1px solid rgba(255,255,255,0.06); }

  .card { background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border-radius:12px; padding:12px; border:1px solid rgba(255,255,255,0.03); color:var(--acid2); }

  #leaderboardList { display:flex; flex-direction:column; gap:8px; max-height:60vh; overflow:auto; }
  .leader-row { display:flex; justify-content:space-between; gap:12px; align-items:center; padding:8px; border-radius:8px; background:linear-gradient(180deg, rgba(255,255,255,0.008), rgba(255,255,255,0.006)); border:1px solid rgba(255,255,255,0.02); }

  @media (max-width:700px) { #welcomeText { font-size:clamp(28px,12vw,96px); } }

</style>
</head>
<body>

<div id="screenRegister" class="screen active" aria-hidden="false">

  <div id="langWrap">
    <button id="langRu" class="fire-btn" data-lang="ru" aria-label="Русский">Ru</button>
    <button id="langEn" class="fire-btn" data-lang="en" aria-label="English">Eng</button>
  </div>

  <div id="regStage" role="region" aria-label="Регистрация">
    <div style="height:calc(860/2532*100vh);"></div>

    <div id="welcomeBlock" class="card" style="text-align:center;">
      <h1 id="welcomeText">Welcome</h1>
      <p id="subText" style="color:var(--muted);margin-top:8px;">Создайте аккаунт или войдите</p>
    </div>

    <div id="btnStart" role="button" tabindex="0" aria-pressed="false">Зарегистрироваться</div>

    <div style="flex:1;"></div>
  </div>

  <div id="zoomControls" aria-hidden="true">
    <button id="zoomIn" aria-label="Увеличить">+</button>
    <button id="zoomOut" aria-label="Уменьшить">−</button>
    <button id="zoomReset" aria-label="Сбросить">◯</button>
  </div>

  <div id="regFormOverlay" role="dialog" aria-modal="true" aria-hidden="true">
    <button id="closeReg" aria-label="Закрыть" style="position:absolute;right:12px;top:12px;background:transparent;border:none;color:#fff;font-size:22px;cursor:pointer">✕</button>

    <input id="regUsername" class="reg-input" placeholder="Имя пользователя" aria-label="Имя пользователя" />
    <input id="regEmail" class="reg-input" placeholder="Эл. почта" type="email" aria-label="Эл. почта" />
    <input id="regPassword" class="reg-input" placeholder="Пароль" type="password" aria-label="Пароль" />

    <div id="regSubmit" role="button" tabindex="0" style="width:min(800px,86%);height:calc(200/2532*100vh);background:var(--acid1);color:#000;font-size:clamp(16px,3vw,34px);font-weight:800;display:flex;align-items:center;justify-content:center;border-radius:12px;cursor:pointer">
      Зарегистрироваться
    </div>
  </div>

</div>

<div id="screenApp" class="screen" aria-hidden="true">
  <div class="topbar">
    <div style="display:flex;gap:12px;align-items:center;">
      <div id="usernameLabel" style="font-weight:900">—</div>
      <div id="pointsLabel" style="color:var(--muted)">Очки: 0</div>
      <div id="levelLabel" style="color:var(--muted)">Уровень: 0</div>
    </div>

    <div style="display:flex;gap:8px;align-items:center;">
      <button id="btnLeaderboard" class="btn">Leaderboard</button>
      <button id="btnLogout" class="btn secondary">Выйти</button>
    </div>
  </div>

  <div style="display:flex;gap:12px;align-items:flex-start;">
    <div style="flex:1;max-width:520px;">
      <div class="card" style="margin-bottom:12px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div style="font-weight:800">Задания</div>
          <button id="btnCreateTask" class="btn secondary">Создать</button>
        </div>

        <div id="tasksList" style="margin-top:12px;display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow:auto"></div>
      </div>
    </div>

    <div style="width:360px;">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <div style="font-weight:800">Top (быстрый просмотр)</div>
          <div style="color:var(--muted);font-size:13px">Real-time</div>
        </div>
        <div id="leaderboardPreview" style="display:flex;flex-direction:column;gap:8px;max-height:70vh;overflow:auto"></div>
      </div>
    </div>
  </div>
</div>

<div id="leaderboardScreen" class="screen" aria-hidden="true" style="display:none;padding:18px;">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
    <div style="font-weight:900">Leaderboard — Топ игроков</div>
    <div>
      <button id="backToApp" class="btn secondary">Назад</button>
    </div>
  </div>

  <div id="leaderboardList" class="card"></div>
</div>

<div style="display:none;">
  <input id="inputUsername" />
  <input id="inputEmail" />
  <input id="inputPassword" />
  <button id="btnRegister" style="display:none">register</button>
</div>

<script type="module">
import {{ createClient }} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const SUPABASE_URL = "https://dbkzfwxtfeowtjftdgke.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRia3pmd3h0ZmVvd3RqZnRkZ2tlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA3NDc1MzYsImV4cCI6MjA3NjMyMzUzNn0.yXf9Gq9LUP9_4M9sfLntpsYECrDxWxSUpQzMfMYcZAM";
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON);

const DICT = {
  welcome: { ru: 'Добро пожаловать', en: 'Welcome' },
  register: { ru: 'Зарегистрироваться', en: 'Register' },
  username_ph: { ru: 'Имя пользователя', en: 'Username' },
  email_ph: { ru: 'Эл. почта', en: 'Email' },
  password_ph: { ru: 'Пароль', en: 'Password' },
  fill_fields: { ru: 'Заполните все поля', en: 'Fill all fields' },
  registered_local: { ru: 'Зарегистрировано локально', en: 'Registered locally' },
  registration_error: { ru: 'Ошибка регистрации', en: 'Registration error' }
};

const el = {
  langRu: document.getElementById('langRu'),
  langEn: document.getElementById('langEn'),
  welcomeText: document.getElementById('welcomeText'),
  subText: document.getElementById('subText'),
  btnStart: document.getElementById('btnStart'),
  regStage: document.getElementById('regStage'),
  regFormOverlay: document.getElementById('regFormOverlay'),
  closeReg: document.getElementById('closeReg'),
  regUsername: document.getElementById('regUsername'),
  regEmail: document.getElementById('regEmail'),
  regPassword: document.getElementById('regPassword'),
  regSubmit: document.getElementById('regSubmit'),
  zoomIn: document.getElementById('zoomIn'),
  zoomOut: document.getElementById('zoomOut'),
  zoomReset: document.getElementById('zoomReset'),
  screenApp: document.getElementById('screenApp'),
  usernameLabel: document.getElementById('usernameLabel'),
  pointsLabel: document.getElementById('pointsLabel'),
  levelLabel: document.getElementById('levelLabel'),
  btnLeaderboard: document.getElementById('btnLeaderboard'),
  btnLogout: document.getElementById('btnLogout'),
  tasksList: document.getElementById('tasksList'),
  btnCreateTask: document.getElementById('btnCreateTask'),
  leaderboardPreview: document.getElementById('leaderboardPreview'),
  leaderboardScreen: document.getElementById('leaderboardScreen'),
  leaderboardList: document.getElementById('leaderboardList'),
  backToApp: document.getElementById('backToApp'),
};

let state = {
  user: null,
  scale: 1,
  minScale: 0.6,
  maxScale: 2.0,
  step: 0.1,
};

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('leaderboardScreen').style.display = 'none';
  const target = document.getElementById(id);
  if (target) {
    target.classList.add('active');
  }
}

function showLeaderboardScreen() {
  document.getElementById('leaderboardScreen').style.display = 'block';
  document.getElementById('leaderboardScreen').classList.add('active');
  document.getElementById('screenApp').classList.remove('active');
}

function hideLeaderboardScreen() {
  document.getElementById('leaderboardScreen').style.display = 'none';
  document.getElementById('leaderboardScreen').classList.remove('active');
  document.getElementById('screenApp').classList.add('active');
}

function setLang(lang) {
  localStorage.setItem('siteLang', lang);
  document.documentElement.setAttribute('data-lang', lang);
  el.welcomeText.textContent = DICT.welcome[lang] || DICT.welcome.en;
  el.btnStart.textContent = DICT.register[lang] || DICT.register.en;
  el.regSubmit.textContent = DICT.register[lang] || DICT.register.en;
  el.regUsername.placeholder = DICT.username_ph[lang];
  el.regEmail.placeholder = DICT.email_ph[lang];
  el.regPassword.placeholder = DICT.password_ph[lang];
}

const savedLang = localStorage.getItem('siteLang') || (navigator.language && navigator.language.startsWith('ru') ? 'ru' : 'en');
setLang(savedLang);
el.langRu.addEventListener('click', () => setLang('ru'));
el.langEn.addEventListener('click', () => setLang('en'));

function applyScale() {
  el.regStage.style.transform = 'translateX(-50%) scale(' + state.scale + ')';
}
if (el.zoomIn) el.zoomIn.addEventListener('click', () => { state.scale = Math.min(state.maxScale, +(state.scale + state.step).toFixed(2)); applyScale(); });
if (el.zoomOut) el.zoomOut.addEventListener('click', () => { state.scale = Math.max(state.minScale, +(state.scale - state.step).toFixed(2)); applyScale(); });
if (el.zoomReset) el.zoomReset.addEventListener('click', () => { state.scale = 1; applyScale(); });

let pointerOver = false;
if (el.regStage) {
  el.regStage.addEventListener('mouseenter', () => pointerOver = true);
  el.regStage.addEventListener('mouseleave', () => pointerOver = false);
}
window.addEventListener('wheel', (e) => {
  if(!pointerOver) return;
  e.preventDefault();
  if(e.deltaY < 0) state.scale = Math.min(state.maxScale, +(state.scale + state.step).toFixed(2));
  else state.scale = Math.max(state.minScale, +(state.scale - state.step).toFixed(2));
  applyScale();
}, { passive:false });

let lastDist = null;
window.addEventListener('touchmove', (e) => {
  if(e.touches && e.touches.length == 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx,dy);
    if(lastDist) {
      const diff = dist - lastDist;
      if(Math.abs(diff) > 6) {
        state.scale = Math.max(state.minScale, Math.min(state.maxScale, +(state.scale + diff*0.001).toFixed(2)));
        applyScale();
      }
    }
    lastDist = dist;
    e.preventDefault();
  } else lastDist = null;
}, { passive:false });

el.btnStart.addEventListener('click', () => {
  el.regFormOverlay.style.display = 'flex';
  el.regFormOverlay.setAttribute('aria-hidden', 'false');
  el.regUsername.focus();
});

el.closeReg.addEventListener('click', () => {
  el.regFormOverlay.style.display = 'none';
  el.regFormOverlay.setAttribute('aria-hidden', 'true');
});

function enterAppWithUser(userProfile) {
  state.user = userProfile;
  el.usernameLabel.textContent = userProfile.username || userProfile.email || '—';
  el.pointsLabel.textContent = 'Очки: ' + (userProfile.points || 0);
  el.levelLabel.textContent = 'Уровень: ' + (userProfile.level || 0);

  document.getElementById('screenRegister').classList.remove('active');
  document.getElementById('screenRegister').setAttribute('aria-hidden', 'true');
  document.getElementById('screenApp').classList.add('active');
  document.getElementById('screenApp').setAttribute('aria-hidden', 'false');

  loadTasks();
  loadLeaderboardPreview();
}

// Registration with Supabase
el.regSubmit.addEventListener('click', async () => {
  const username = el.regUsername.value.trim();
  const email = el.regEmail.value.trim();
  const password = el.regPassword.value;
  const lang = localStorage.getItem('siteLang') || 'ru';

  if(!username || !email || !password) {
    alert(DICT.fill_fields[lang]);
    return;
  }

  try {
    const { data: signUpData, error: signUpError } = await supabase.auth.signUp(
      { email, password },
      { data: { username } }
    );
    if(signUpError) {
      console.warn('signUpError', signUpError);
    }

    const { data: signInData, error: signInError } = await supabase.auth.signInWithPassword({ email, password });
    if(signInError) {
      console.warn('signInError', signInError);
    }

    const { data: sessionData } = await supabase.auth.getSession();
    if(sessionData && sessionData.session) {
      const userId = sessionData.session.user.id;

      try {
        await supabase.from('profiles').upsert({ id: userId, username: username, email: email }, { returning: 'minimal' });
      } catch (e) {
        console.warn('profiles upsert failed', e);
      }

      const { data: profiles } = await supabase.from('profiles').select('*').eq('id', userId).limit(1).single();
      if(profiles) {
        enterAppWithUser(profiles);
        el.regFormOverlay.style.display = 'none';
        return;
      } else {
        const local = { id: userId, username, email, points:0, level:0 };
        enterAppWithUser(local);
        el.regFormOverlay.style.display = 'none';
        return;
      }
    }

    const id = 'u_' + Date.now();
    const users = JSON.parse(localStorage.getItem('demo_users_v1') || '{}');
    users[id] = { id, username, email, password, points:0, level:0, diary:{}, tasks:{} };
    localStorage.setItem('demo_users_v1', JSON.stringify(users));
    alert(DICT.registered_local[lang]);
    el.regFormOverlay.style.display = 'none';
    enterAppWithUser(users[id]);

  } catch (err) {
    console.error(err);
    alert(DICT.registration_error[localStorage.getItem('siteLang') || 'ru']);
  }
});

// Auto-enter if session exists
(async () => {
  try {
    const res = await supabase.auth.getSession();
    if(res && res.data && res.data.session) {
      const userId = res.data.session.user.id;
      const { data: profile } = await supabase.from('profiles').select('*').eq('id', userId).limit(1).single();
      if(profile) {
        enterAppWithUser(profile);
      }
    }
  } catch(e) {
    console.warn('session check failed', e);
  }
})();

// Tasks
async function loadTasks() {
  try {
    if(!state.user || !state.user.id) return;
    const { data: tasks, error } = await supabase
      .from('tasks')
      .select('*')
      .eq('owner_id', state.user.id)
      .order('created_at', { ascending: false });

    if(error) throw error;
    renderTasks(tasks || []);
  } catch (e) {
    console.warn('loadTasks fallback', e);
    const users = JSON.parse(localStorage.getItem('demo_users_v1') || '{}');
    const tasks = (users[state.user.id] && users[state.user.id].tasks) ? Object.values(users[state.user.id].tasks) : [];
    renderTasks(tasks);
  }
}

function renderTasks(tasks) {
  el.tasksList.innerHTML = '';
  if(!tasks || tasks.length === 0) {
    el.tasksList.innerHTML = '<div style="color:var(--muted)">Нет заданий</div>';
    return;
  }
  tasks.forEach(t => {
    const row = document.createElement('div');
    row.className = 'leader-row';
    const btnLabel = t.done ? 'Готово' : 'Выполнить';
    const secondaryClass = t.done ? '' : 'secondary';
    row.innerHTML = `
      <div style="display:flex;gap:12px;align-items:center;">
        <div style="font-weight:800">${t.title || '—'}</div>
        <div style="font-size:13px;color:var(--muted)">+${t.points || 0} очк.</div>
      </div>
      <div>
        <button data-id="${t.id}" class="btn ${secondaryClass}" data-done="${t.done ? '1':'0'}">${btnLabel}</button>
      </div>
    `;
    el.tasksList.appendChild(row);
  });

  el.tasksList.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const id = btn.dataset.id;
      const done = btn.dataset.done === '1';
      if(done) return;
      await markTaskDone(id);
    });
  });
}

el.btnCreateTask.addEventListener('click', async () => {
  const title = prompt('Название задания (коротко):');
  const pts = parseInt(prompt('Сколько очков даёт за выполнение? (число)', '10')) || 10;
  if(!title) return;
  try {
    const payload = { owner_id: state.user.id, title, points: pts };
    const { data, error } = await supabase.from('tasks').insert([payload]).select();
    if(error) throw error;
    await loadTasks();
  } catch(e) {
    console.warn('create task fallback', e);
    const users = JSON.parse(localStorage.getItem('demo_users_v1') || '{}');
    const id = 't_' + Date.now();
    const t = { id, owner_id: state.user.id, title, points: pts, done: false, created_at: new Date().toISOString() };
    users[state.user.id] = users[state.user.id] || { tasks: {} };
    users[state.user.id].tasks = users[state.user.id].tasks || {};
    users[state.user.id].tasks[id] = t;
    localStorage.setItem('demo_users_v1', JSON.stringify(users));
    loadTasks();
  }
});

async function markTaskDone(taskId) {
  try {
    const { data: task } = await supabase.from('tasks').select('*').eq('id', taskId).single();
    if(!task) throw new Error('task missing');
    if(task.done) return;

    const { data:update, error:updateError } = await supabase.from('tasks').update({ done: true }).eq('id', taskId);
    if(updateError) throw updateError;

    const delta = task.points || 0;
    try {
      await supabase.rpc('add_points', { user_id_param: state.user.id, delta_param: delta });
    } catch(rpcErr) {
      console.warn('rpc failed', rpcErr);
      await supabase.from('profiles').update({ points: (state.user.points || 0) + delta }).eq('id', state.user.id);
    }

    const { data: profile } = await supabase.from('profiles').select('*').eq('id', state.user.id).single();
    if(profile) {
      state.user = profile;
      el.pointsLabel.textContent = 'Очки: ' + (profile.points || 0);
      el.levelLabel.textContent = 'Уровень: ' + (profile.level || 0);
    }
    await loadTasks();
  } catch(e) {
    console.error('markTaskDone error', e);
    alert('Ошибка при выполнении задания');
  }
}

async function loadLeaderboardPreview() {
  try {
    const { data, error } = await supabase.from('profiles').select('id,username,points,level').order('points', { ascending: false }).limit(5);
    if(error) throw error;
    renderLeaderboardPreview(data || []);
  } catch(e) {
    console.warn('leaderboard preview failed', e);
  }
}

function renderLeaderboardPreview(rows) {
  el.leaderboardPreview.innerHTML = '';
  rows.forEach(r => {
    const div = document.createElement('div');
    div.className = 'leader-row';
    div.innerHTML = `<div style="font-weight:800">${r.username||r.email||'—'}</div><div style="color:var(--muted)">${r.points||0} pts • L:${r.level||0}</div>`;
    el.leaderboardPreview.appendChild(div);
  });
}

async function loadLeaderboardFull() {
  try {
    const { data, error } = await supabase.from('profiles').select('id,username,points,level').order('points', { ascending: false });
    if(error) throw error;
    renderLeaderboardFull(data || []);
  } catch(e) {
    console.warn('leaderboard full failed', e);
    alert('Не удалось загрузить лидерборд');
  }
}

function renderLeaderboardFull(rows) {
  const list = el.leaderboardList;
  list.innerHTML = '';
  rows.forEach((r, idx) => {
    const row = document.createElement('div');
    row.className = 'leader-row';
    row.innerHTML = `<div style="display:flex;gap:12px;align-items:center;"><div style="font-weight:900">${idx+1}.</div><div style="font-weight:800">${r.username||r.email||'—'}</div></div><div style="color:var(--muted)">${r.points||0} pts • L:${r.level||0}</div>`;
    list.appendChild(row);
  });
}

function subscribeProfilesRealtime() {
  try {
    const channel = supabase.channel('public:profiles')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, payload => {
        loadLeaderboardPreview();
        const newRow = payload.new;
        if(newRow && state.user && newRow.id === state.user.id) {
          state.user.points = newRow.points;
          state.user.level = newRow.level;
          el.pointsLabel.textContent = 'Очки: ' + (newRow.points || 0);
          el.levelLabel.textContent = 'Уровень: ' + (newRow.level || 0);
        }
      })
      .subscribe();
  } catch(e) {
    console.warn('subscribeProfilesRealtime failed', e);
  }
}

el.btnLogout.addEventListener('click', async () => {
  try { await supabase.auth.signOut(); } catch(e) { console.warn('signOut failed', e); }
  state.user = null;
  document.getElementById('screenApp').classList.remove('active');
  document.getElementById('screenRegister').classList.add('active');
  document.getElementById('screenRegister').setAttribute('aria-hidden', 'false');
});

el.btnLeaderboard.addEventListener('click', async () => {
  await loadLeaderboardFull();
  showLeaderboardScreen();
});
el.backToApp.addEventListener('click', () => { hideLeaderboardScreen(); });

subscribeProfilesRealtime();
loadLeaderboardPreview();

</script>
</body>
</html>
