<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>MyChange — регистрация и лидерборд</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg:#000;
      --acid1:#8cff3b;
      --acid2:#d4ff9f;
      --fire1:#ff5a00;
      --fire2:#ff9900;
      --muted:#9aa4b2;
      --card:#0b0b0b;
    }
    html,body{
      height:100%;margin:0;
      background:var(--bg);
      color:var(--acid2);
      font-family:Inter,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }
    .screen{display:none;width:100vw;height:100vh;overflow:hidden;position:relative}
    .screen.active{display:block}
    #screenRegister{display:flex;align-items:flex-start;justify-content:center}
    #regStage{
      position:relative;left:50%;transform:translateX(-50%) scale(1);
      transform-origin:50% 0;
      width:min(1200px,96vw);height:100vh;
      display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
      gap:5vh;box-sizing:border-box;
    }
    #welcomeBlock{width:min(1000px,90%);display:flex;align-items:center;justify-content:center;padding:0 12px}
    #welcomeText{
      margin:0;font-weight:900;line-height:1;letter-spacing:-0.02em;
      font-size:clamp(36px,8vw,160px);
      background:linear-gradient(180deg,var(--acid1) 0%,#001100 80%);
      -webkit-background-clip:text;background-clip:text;color:transparent;
      text-shadow:3px 3px 6px rgba(140,255,59,0.9);text-align:center;width:100%;
    }
    #btnStart{
      width:clamp(260px,40vw,490px);height:clamp(48px,7vh,172px);
      border:5px solid #006600;border-radius:30px;
      color:var(--acid1);font-size:clamp(16px,3.5vw,48px);
      font-weight:800;display:flex;align-items:center;justify-content:center;
      background:transparent;cursor:pointer;transition:.15s;
    }
    #btnStart:active{transform:scale(.97)}
    #langWrap{position:fixed;top:12px;right:12px;display:flex;gap:10px;z-index:9999}
    .fire-btn{
      border:none;border-radius:12px;padding:8px 12px;
      font-weight:900;cursor:pointer;color:#fff;
      background:linear-gradient(180deg,var(--fire1) 0%,var(--fire2) 45%,#660000 100%);
      box-shadow:0 0 10px rgba(255,120,0,.6),inset 0 -6px 14px rgba(0,0,0,.35);
      text-shadow:0 2px 6px rgba(0,0,0,.6);
      border:3px solid rgba(255,160,30,.85);
      animation:ember 2.2s infinite linear;
    }
    @keyframes ember{
      0%{filter:brightness(1) drop-shadow(0 0 6px rgba(255,120,0,.6))}
      50%{filter:brightness(1.1) drop-shadow(0 0 14px rgba(255,200,60,.9));transform:translateY(-3px) scale(1.02)}
      100%{filter:brightness(1) drop-shadow(0 0 6px rgba(255,120,0,.6));transform:none}
    }
    #zoomControls{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:9999}
    #zoomControls button{width:48px;height:48px;border-radius:8px;border:none;background:rgba(255,255,255,.06);color:#fff;font-size:20px;cursor:pointer}
    #regFormOverlay{
      display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
      width:min(1000px,92vw);height:min(860px,92vh);
      background:rgba(0,0,0,.95);border:2px solid var(--acid1);border-radius:18px;
      z-index:2000;padding:20px;box-sizing:border-box;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;
    }
    .reg-input{
      width:min(800px,86%);max-height:88px;
      border:3px solid var(--acid1);border-radius:12px;background:transparent;
      color:var(--acid1);font-size:clamp(14px,2.8vw,34px);padding:10px 16px;outline:none;
    }
    .reg-input::placeholder{color:rgba(140,255,59,.45)}
    #screenApp{padding:18px;box-sizing:border-box}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
    .btn{background:linear-gradient(90deg,var(--acid1),var(--acid2));border:none;color:#001;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:800}
    .btn.secondary{background:transparent;color:var(--acid2);border:1px solid rgba(255,255,255,.06)}
    .card{background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,.01));border-radius:12px;padding:12px;border:1px solid rgba(255,255,255,.03);color:var(--acid2)}
    .leader-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px;border-radius:8px;background:linear-gradient(180deg,rgba(255,255,255,.008),rgba(255,255,255,.006));border:1px solid rgba(255,255,255,.02)}
    @media(max-width:700px){#welcomeText{font-size:clamp(28px,12vw,96px)}}
  </style>
</head>
<body>
<!-- Экран регистрации -->
<div id="screenRegister" class="screen active" aria-hidden="false">
  <div id="langWrap">
    <button id="langRu" class="fire-btn" data-lang="ru" aria-label="Русский">Ru</button>
    <button id="langEn" class="fire-btn" data-lang="en" aria-label="English">En</button>
  </div>
  <div id="regStage" role="region" aria-label="Регистрация">
    <div style="height:calc(860/2532*100vh)"></div>
    <div id="welcomeBlock" class="card" style="text-align:center">
      <h1 id="welcomeText">Welcome</h1>
      <p id="subText" style="color:var(--muted);margin-top:8px">Создайте аккаунт или войдите</p>
    </div>
    <div id="btnStart" role="button" tabindex="0">Зарегистрироваться</div>
    <div style="flex:1"></div>
  </div>

  <div id="zoomControls" aria-hidden="true">
    <button id="zoomIn" aria-label="Увеличить">+</button>
    <button id="zoomOut" aria-label="Уменьшить">−</button>
    <button id="zoomReset" aria-label="Сбросить">◯</button>
  </div>

  <div id="regFormOverlay" role="dialog" aria-modal="true" aria-hidden="true">
    <button id="closeReg" aria-label="Закрыть"
      style="position:absolute;right:12px;top:12px;background:transparent;border:none;color:#fff;font-size:22px;cursor:pointer">
      ✕
    </button>
    <input id="regUsername" class="reg-input" placeholder="Имя пользователя" aria-label="Имя пользователя">
    <input id="regEmail" class="reg-input" placeholder="Эл. почта" type="email" aria-label="Эл. почта">
    <input id="regPassword" class="reg-input" placeholder="Пароль" type="password" aria-label="Пароль">
    <div id="regSubmit"
      style="width:min(800px,86%);height:calc(200/2532*100vh);background:var(--acid1);color:#000;font-size:clamp(16px,3vw,34px);font-weight:800;display:flex;align-items:center;justify-content:center;border-radius:12px;cursor:pointer">
      Зарегистрироваться
    </div>
  </div>
</div>

<!-- Основное приложение -->
<div id="screenApp" class="screen" aria-hidden="true">
  <div class="topbar">
    <div style="display:flex;gap:12px;align-items:center">
      <div id="usernameLabel" style="font-weight:900">—</div>
      <div id="pointsLabel" style="color:var(--muted)">Очки: 0</div>
      <div id="levelLabel" style="color:var(--muted)">Уровень: 0</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button id="btnLeaderboard" class="btn">Leaderboard</button>
      <button id="btnLogout" class="btn secondary">Выйти</button>
    </div>
  </div>

  <div style="display:flex;gap:12px;align-items:flex-start">
    <div style="flex:1;max-width:520px">
      <div class="card" style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div style="font-weight:800">Задания</div>
          <button id="btnCreateTask" class="btn secondary">Создать</button>
        </div>
        <div id="tasksList"
          style="margin-top:12px;display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow:auto"></div>
      </div>
    </div>

    <div style="width:360px">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <div style="font-weight:800">Top (быстрый просмотр)</div>
          <div style="color:var(--muted);font-size:13px">Real-time</div>
        </div>
        <div id="leaderboardPreview"
          style="display:flex;flex-direction:column;gap:8px;max-height:70vh;overflow:auto"></div>
      </div>
    </div>
  </div>
</div>

<!-- Лидерборд -->
<div id="leaderboardScreen" class="screen" aria-hidden="true" style="display:none;padding:18px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div style="font-weight:900">Leaderboard — Топ игроков</div>
    <div><button id="backToApp" class="btn secondary">Назад</button></div>
  </div>
  <div id="leaderboardList" class="card"></div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

/* ====== Настройка Supabase ====== */
const SUPABASE_URL = "https://dbkzfwxtfeowtjftdgke.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRia3pmd3h0ZmVvd3RqZnRkZ2tlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA3NDc1MzYsImV4cCI6MjA3NjMyMzUzNn0.yXf9Gq9LUP9_4M9sfLntpsYECrDxWxSUpQzMfMYcZAM";
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

/* ====== Элементы интерфейса ====== */
const el = {
  screenRegister: document.getElementById("screenRegister"),
  screenApp: document.getElementById("screenApp"),
  regForm: document.getElementById("regFormOverlay"),
  btnStart: document.getElementById("btnStart"),
  closeReg: document.getElementById("closeReg"),
  regUsername: document.getElementById("regUsername"),
  regEmail: document.getElementById("regEmail"),
  regPassword: document.getElementById("regPassword"),
  regSubmit: document.getElementById("regSubmit"),
  usernameLabel: document.getElementById("usernameLabel"),
  pointsLabel: document.getElementById("pointsLabel"),
  levelLabel: document.getElementById("levelLabel"),
  btnLogout: document.getElementById("btnLogout"),
  btnCreateTask: document.getElementById("btnCreateTask"),
  tasksList: document.getElementById("tasksList"),
  leaderboardPreview: document.getElementById("leaderboardPreview"),
  leaderboardScreen: document.getElementById("leaderboardScreen"),
  leaderboardList: document.getElementById("leaderboardList"),
  btnLeaderboard: document.getElementById("btnLeaderboard"),
  backToApp: document.getElementById("backToApp"),
  welcomeText: document.getElementById("welcomeText")
};

/* ====== Состояние ====== */
let state = { user: null };

/* ====== Помощники ====== */
function show(elm){elm.classList.add("active");elm.setAttribute("aria-hidden","false");}
function hide(elm){elm.classList.remove("active");elm.setAttribute("aria-hidden","true");}

/* ====== Переключения экранов ====== */
function enterApp(profile){
  state.user = profile;
  el.usernameLabel.textContent = profile.username || profile.email || "—";
  el.pointsLabel.textContent = "Очки: " + (profile.points || 0);
  el.levelLabel.textContent = "Уровень: " + (profile.level || 0);
  hide(el.screenRegister);
  show(el.screenApp);
  loadTasks();
  loadLeaderboard();
}

/* ====== Регистрация ====== */
el.btnStart.onclick = ()=>{el.regForm.style.display="flex";el.regUsername.focus();}
el.closeReg.onclick = ()=>{el.regForm.style.display="none";}

el.regSubmit.onclick = async ()=>{
  const name = el.regUsername.value.trim();
  const email = el.regEmail.value.trim();
  const pass = el.regPassword.value.trim();
  if(!name||!email||!pass){alert("Заполните все поля");return;}
  try{
    const {data:su, error:se}=await supabase.auth.signUp({email,password:pass,options:{data:{username:name}}});
    if(se) throw se;
    const {data:si,error:sie}=await supabase.auth.signInWithPassword({email,password:pass});
    if(sie) throw sie;
    const {data:sess}=await supabase.auth.getSession();
    if(sess.session){
      const id=sess.session.user.id;
      await supabase.from("profiles").upsert({id,username:name,email},{returning:"minimal"});
      const {data:p}=await supabase.from("profiles").select("*").eq("id",id).single();
      enterApp(p||{id,username:name,email,points:0,level:0});
      el.regForm.style.display="none";
    }
  }catch(e){
    console.warn("Supabase недоступен, используем локально",e);
    const id="u_"+Date.now();
    const users=JSON.parse(localStorage.getItem("users")||"{}");
    users[id]={id,username:name,email,points:0,level:0,tasks:{}};
    localStorage.setItem("users",JSON.stringify(users));
    enterApp(users[id]);
    el.regForm.style.display="none";
  }
};

/* ====== Автовход ====== */
(async()=>{
  try{
    const {data}=await supabase.auth.getSession();
    if(data.session){
      const id=data.session.user.id;
      const {data:p}=await supabase.from("profiles").select("*").eq("id",id).single();
      if(p) enterApp(p);
    }
  }catch(e){
    const u=JSON.parse(localStorage.getItem("users")||"{}");
    const any=Object.values(u)[0];
    if(any) enterApp(any);
  }
})();

/* ====== Выход ====== */
el.btnLogout.onclick = async ()=>{
  try{await supabase.auth.signOut();}catch{}
  state.user=null;
  hide(el.screenApp);
  show(el.screenRegister);
};

/* ====== Задания ====== */
async function loadTasks(){
  if(!state.user)return;
  try{
    const {data,error}=await supabase.from("tasks").select("*").eq("owner_id",state.user.id).order("created_at",{ascending:false});
    if(error)throw error;
    renderTasks(data);
  }catch(e){
    const users=JSON.parse(localStorage.getItem("users")||"{}");
    const t=users[state.user.id]?.tasks||{};
    renderTasks(Object.values(t));
  }
}
function renderTasks(list){
  el.tasksList.innerHTML="";
  if(!list||!list.length){el.tasksList.textContent="Нет заданий";return;}
  list.forEach(t=>{
    const div=document.createElement("div");
    div.className="leader-row";
    div.innerHTML=`<div><b>${t.title}</b> +${t.points||0}</div><button data-id="${t.id}" class="btn ${t.done?"":"secondary"}">${t.done?"Готово":"Выполнить"}</button>`;
    el.tasksList.appendChild(div);
  });
  el.tasksList.querySelectorAll("button").forEach(b=>b.onclick=()=>markTaskDone(b.dataset.id));
}
el.btnCreateTask.onclick = async ()=>{
  const title=prompt("Название задания:");
  if(!title)return;
  const pts=parseInt(prompt("Очки за выполнение:",10))||10;
  try{
    await supabase.from("tasks").insert([{owner_id:state.user.id,title,points:pts}]);
    loadTasks();
  }catch{
    const users=JSON.parse(localStorage.getItem("users")||"{}");
    const id="t_"+Date.now();
    const t={id,owner_id:state.user.id,title,points:pts,done:false};
    users[state.user.id].tasks[id]=t;
    localStorage.setItem("users",JSON.stringify(users));
    loadTasks();
  }
};
async function markTaskDone(id){
  try{
    await supabase.from("tasks").update({done:true}).eq("id",id);
    loadTasks();
  }catch{
    const users=JSON.parse(localStorage.getItem("users")||"{}");
    const t=users[state.user.id].tasks[id];
    if(t){t.done=true;localStorage.setItem("users",JSON.stringify(users));loadTasks();}
  }
}

/* ====== Лидерборд ====== */
async function loadLeaderboard(){
  try{
    const {data}=await supabase.from("profiles").select("username,points,level").order("points",{ascending:false}).limit(5);
    renderLeaderboard(data);
  }catch{}
}
function renderLeaderboard(list){
  el.leaderboardPreview.innerHTML="";
  (list||[]).forEach(r=>{
    const d=document.createElement("div");
    d.className="leader-row";
    d.innerHTML=`<div>${r.username}</div><div>${r.points||0} pts • L:${r.level||0}</div>`;
    el.leaderboardPreview.appendChild(d);
  });
}
el.btnLeaderboard.onclick = async ()=>{
  const {data}=await supabase.from("profiles").select("username,points,level").order("points",{ascending:false});
  el.leaderboardList.innerHTML="";
  (data||[]).forEach((r,i)=>{
    const row=document.createElement("div");
    row.className="leader-row";
    row.innerHTML=`<div><b>${i+1}.</b> ${r.username}</div><div>${r.points||0} pts • L:${r.level||0}</div>`;
    el.leaderboardList.appendChild(row);
  });
  el.leaderboardScreen.style.display="block";
  hide(el.screenApp);
};
el.backToApp.onclick = ()=>{
  el.leaderboardScreen.style.display="none";
  show(el.screenApp);
};
</script>
</body>
</html>
</body>
</html>
